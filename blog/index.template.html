<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog — Practical Supply Chain Planning</title>
    <meta
      name="description"
      content="Practical articles on inventory planning, supply chain decisions, and operational planning."
    />
    <link rel="icon" href="/assets/brand/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/assets/styles.css?v=11" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__link" href="/">
          <img
            class="site-header__logo"
            src="/assets/brand/logo.jpg?v=2"
            alt="Practical Supply Chain Planning"
          />
        </a>
        <nav class="site-nav" aria-label="Primary">
          <ul class="site-nav__list">
            <li>
              <a class="site-nav__link" href="/">Home</a>
            </li>
            <li>
              <a
                class="site-nav__link site-nav__link--active"
                href="/blog/"
                aria-current="page"
                >Blog</a
              >
            </li>
            <li>
              <a class="site-nav__link" href="/about/">About</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <h1 class="page-title">Blog</h1>
      <p class="tagline">
        Practical articles on inventory planning, supply chain decisions, and
        operational planning.
      </p>

      <div id="blog-posts" class="blog-list">
        {{BLOG_POSTS}}
      </div>
    </main>

    <script src="/assets/blog.js?v=2" defer></script>
  </body>
</html>
