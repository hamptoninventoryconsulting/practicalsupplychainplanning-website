<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{SEARCH_TITLE}}</title>
    <meta name="description" content="{{SEARCH_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <link rel="icon" href="/assets/brand/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/assets/styles.css?v=8" />
    <script type="application/ld+json">
{{SCHEMA_JSON_LD}}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__link" href="/">
          <img
            class="site-header__logo"
            src="/assets/brand/logo.jpg?v=2"
            alt="Practical Supply Chain Planning"
          />
        </a>
        <nav class="site-nav" aria-label="Primary">
          <ul class="site-nav__list">
            <li>
              <a class="site-nav__link" href="/">Home</a>
            </li>
            <li>
              <a
                class="site-nav__link site-nav__link--active"
                href="/blog/"
                aria-current="page"
                >Blog</a
              >
            </li>
            <li>
              <a class="site-nav__link" href="/about/">About</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <p><a href="/blog/">← Back to Blog</a></p>

      <article>
        <header class="article-header">
          <img
            class="article-hero"
            src="/images/{{FEATURED_IMAGE_FILENAME}}"
            alt="{{ARTICLE_TITLE}}"
          />

          <h1 class="page-title">{{ARTICLE_TITLE}}</h1>
          <p class="tagline">{{SUMMARY}}</p>

          <p
            class="article-meta"
            id="article-meta"
            data-published="{{PUBLISHED_DATE}}"
            data-reading-time="{{READING_TIME}}"
            data-author="{{AUTHOR}}"
          ></p>

          <section class="article-share" aria-labelledby="article-share-heading">
            <h2 class="article-share__title" id="article-share-heading">
              Share this article
            </h2>
            <div class="article-share__actions">
              <a
                class="article-share__button"
                data-share="linkedin"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Share this article on LinkedIn"
                >LinkedIn</a
              >
              <a
                class="article-share__button"
                data-share="x"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Share this article on X"
                >X</a
              >
              <a
                class="article-share__button"
                data-share="email"
                href="#"
                aria-label="Share this article by email"
                >Email</a
              >
              <a
                class="article-share__button"
                data-share="whatsapp"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Share this article on WhatsApp"
                >WhatsApp</a
              >
              <button
                type="button"
                class="article-share__button"
                id="copy-link-button"
                aria-label="Copy article link to clipboard"
              >
                Copy Link
              </button>
            </div>
            <p
              class="article-share__feedback"
              id="copy-link-feedback"
              role="status"
              aria-live="polite"
              hidden
            ></p>
          </section>

          <hr class="article-divider" />
        </header>

        <section class="card article-body">
          <div class="content">
            {{BODY_HTML}}
          </div>
        </section>
      </article>
    </main>

    <script src="/assets/article.js?v=3" defer></script>
  </body>
</html>
