<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{SEARCH_TITLE}}</title>
    <meta name="description" content="{{SEARCH_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <meta property="og:title" content="{{OG_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{OG_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <link rel="icon" href="/assets/brand/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/assets/styles.css?v=9" />
    <script type="application/ld+json">
{{SCHEMA_JSON_LD}}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-header__link" href="/">
          <img
            class="site-header__logo"
            src="/assets/brand/logo.jpg?v=2"
            alt="Practical Supply Chain Planning"
          />
        </a>
        <nav class="site-nav" aria-label="Primary">
          <ul class="site-nav__list">
            <li>
              <a class="site-nav__link" href="/">Home</a>
            </li>
            <li>
              <a
                class="site-nav__link site-nav__link--active"
                href="/blog/"
                aria-current="page"
                >Blog</a
              >
            </li>
            <li>
              <a class="site-nav__link" href="/about/">About</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <p><a href="/blog/">← Back to Blog</a></p>

      <article>
        <header class="article-header">
          <img
            class="article-hero"
            src="/images/{{FEATURED_IMAGE_FILENAME}}"
            alt="{{ARTICLE_TITLE}}"
          />

          <h1 class="page-title">{{ARTICLE_TITLE}}</h1>
          <p class="tagline">{{SUMMARY}}</p>

          <p
            class="article-meta"
            id="article-meta"
            data-published="{{PUBLISHED_DATE}}"
            data-reading-time="{{READING_TIME}}"
            data-author="{{AUTHOR}}"
          ></p>

          <section class="article-share" aria-labelledby="article-share-heading">
            <h2 class="article-share__title" id="article-share-heading">
              Share this article
            </h2>
            <div class="article-share__actions">
              <a
                class="article-share__button"
                data-share="linkedin"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Share this article on LinkedIn"
              >
                <span class="article-share__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                    />
                    <rect width="4" height="12" x="2" y="9" />
                    <circle cx="4" cy="4" r="2" />
                  </svg>
                </span>
                <span class="article-share__label">LinkedIn</span>
              </a>
              <a
                class="article-share__button"
                data-share="x"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Share this article on X"
              >
                <span class="article-share__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </span>
              </a>
              <a
                class="article-share__button"
                data-share="email"
                href="#"
                aria-label="Share this article by email"
              >
                <span class="article-share__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"
                    />
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                  </svg>
                </span>
                <span class="article-share__label">Email</span>
              </a>
              <a
                class="article-share__button"
                data-share="whatsapp"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Share this article on WhatsApp"
              >
                <span class="article-share__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"
                    />
                  </svg>
                </span>
                <span class="article-share__label">WhatsApp</span>
              </a>
              <button
                type="button"
                class="article-share__button"
                id="copy-link-button"
                aria-label="Copy article link to clipboard"
              >
                <span class="article-share__icon" aria-hidden="true">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                    />
                    <path
                      d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                    />
                  </svg>
                </span>
                <span class="article-share__label">Copy Link</span>
              </button>
            </div>
            <p
              class="article-share__feedback"
              id="copy-link-feedback"
              role="status"
              aria-live="polite"
              hidden
            ></p>
          </section>

          <hr class="article-divider" />
        </header>

        <section class="card article-body">
          <div class="content">
            {{BODY_HTML}}
          </div>
        </section>
      </article>
    </main>

    <script src="/assets/article.js?v=3" defer></script>
  </body>
</html>
