# Cloudflare Pages project: Eleventy output + functions/_middleware.js
# functions/ stays at the project root (sibling of _site), not inside the output.
# Flip the Pages dashboard build settings at the same time this lands on main.
name = "practicalsupplychainplanning-website"
compatibility_date = "2026-09-18"
pages_build_output_dir = "_site"

# The results-email route stays closed until the Pages environment is switched
# on later. The D1 binding, when it is added, will be named SIM_RESULTS_DB.
# Secrets stay in the Pages dashboard, not in this file, including
# UNSUBSCRIBE_SIGNING_KEY. UNSUBSCRIBE_SIGNING_KEY_PREVIOUS is optional and
# only accepts links signed before a key rotation. This config does not
# attach a live database. Schema: schema/sim-results.sql. Do not change DNS.
